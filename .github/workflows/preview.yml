name: Chart Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Preview
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.PREVIEW_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "repo": "${{ github.repository }}",
              "pr": ${{ github.event.pull_request.number }},
              "git": {
                "provider": "github",
                "owner": "${{ github.repository_owner }}",
                "repo": "${{ github.event.repository.name }}",
                "ref": "${{ github.event.pull_request.head.sha }}",
                "chartPath": "bitnami/wordpress"
              },
              "values": {
                "image": {
                  "registry": "docker.io",
                  "repository": "bitnami/wordpress",
                  "digest": "sha256:eb2233bf992e52d2d0390b3922e9b5a8045ccca34dc17ca8131c1c8e628f8c1e"
                },
                "service": {
                  "type": "ClusterIP"
                },
                "ingress": {
                  "enabled": true,
                  "ingressClassName": "nginx"
                },
                "persistence": {
                  "enabled": false
                },
                "mariadb": {
                  "image": {
                    "registry": "docker.io",
                    "repository": "bitnami/mariadb",
                    "digest": "sha256:75f4df00065c2bf05f391ef593882f0dbe03b4497b44b3520191c35b2c464e7a"
                  },
                  "primary": {
                    "persistence": {
                      "enabled": false
                    }
                  }
                }
              },
              "head": {
                "owner": "${{ github.repository_owner }}",
                "repo": "${{ github.event.repository.name }}",
                "sha": "${{ github.event.pull_request.head.sha }}"
              }
            }' \
            "https://api.previews.chart-preview.com/previews"
